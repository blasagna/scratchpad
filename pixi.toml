[workspace]
authors = ["Bob DiMaiolo <bdimaiolo@gmail.com>"]
channels = ["conda-forge"]
name = "scratchpad"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
fmt-py = "ruff format ."
# Ask git for the file list rather than globbing with `**`. A bare `./**/*.h` walks
# into symlinked directories, and `microbit_v2_zephyr/build/` holds symlinked dirs
# pointing at ~/zephyrproject (Zephyr generates them for its syscall headers), so the
# glob reformatted 1268 headers of the Zephyr install in place and broke the build.
# The `bazel-*` convenience symlinks lead out of the repo the same way. `-c -o
# --exclude-standard` is tracked plus untracked-but-not-ignored, which keeps brand-new
# files covered while every build directory is skipped.
# (pixi's built-in xargs has no -r, hence the plain -0; the file list is never empty.)
fmt-c = "git ls-files -c -o --exclude-standard -z '*.c' '*.h' '*.cpp' '*.hpp' | xargs -0 clang-format -i"
# The second invocation covers rpi_pico_rust_debug, which is its own standalone
# workspace (it targets thumbv6m-none-eabi) and so is not reached by --all.
fmt-rust = "cargo fmt --all && cargo fmt --all --manifest-path rpi_pico_rust_debug/Cargo.toml"
fmt = { depends-on = ["fmt-py", "fmt-c", "fmt-rust"] }
lint-py = "ruff check"
# Each directory is passed separately so pyrefly infers a distinct import root per
# directory; a single `pyrefly check .` conflates every `solution.py`/`test_solution.py`
# pair under one root and can't resolve the sibling imports. rust_python_bindings needs
# its own pixi env (a compiled extension's stub lives under its own search path) and is
# checked with its own `pixi run type` — see rust_python_bindings/CLAUDE.md.
# `-p default` opts these areas into the same stricter preset dfg/python gets from having
# a pyrefly.toml (without one, pyrefly falls back to `basic`, lenient enough to miss
# `x: int = "s"`). A pyrefly.toml here instead of the flag was tried and rejected: any
# config file switches pyrefly from its per-file "guess the import root" heuristic to one
# shared inferred root, which collides every same-named `solution.py` above and reports
# them as unresolvable imports.
type-py = "pyrefly check -p default algo_little_book/*/ text_analyzer/bench"
# .c files that #include gtest are compiled as C++ (copts = ["-x", "c++"] in their
# BUILD targets, see root CLAUDE.md), so cppcheck needs to treat them as C++ too, or
# it reports their C++ syntax as invalid C. Found by grep rather than hardcoded, so
# a new gtest-wrapped C test file doesn't need this task edited to pick it up.
lint-c-src = "cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --library=googletest $(grep -rl 'gtest' --include='*.c' c_little_book copy_file text_analyzer simple_logger matrix_ops mini_shell tiny_http_server | sed 's/^/-i /') c_little_book copy_file text_analyzer simple_logger matrix_ops mini_shell tiny_http_server"
lint-c-gtest = "cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=ctuOneDefinitionRuleViolation --library=googletest --language=c++ $(grep -rl 'gtest' --include='*.c' c_little_book copy_file text_analyzer simple_logger matrix_ops mini_shell tiny_http_server)"
lint-c = { depends-on = ["lint-c-src", "lint-c-gtest"] }

[dependencies]
ruff = ">=0.15.20,<0.16"
clang-format = ">=22.1.8,<23"
cppcheck = ">=2.21.0,<3"
valgrind = ">=3.27.1,<4"
pyrefly = ">=1.1.1,<2"
python = ">=3.14.6,<3.15"
