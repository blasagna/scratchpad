[workspace]
authors = ["Bob DiMaiolo <bdimaiolo@gmail.com>"]
channels = ["conda-forge"]
name = "scratchpad"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
fmt-py = "ruff format ."
fmt-c = "clang-format -i ./**/*.c ./**/*.h ./**/*.cpp ./**/*.hpp"
fmt-rust = "cargo fmt --all"
fmt = { depends-on = ["fmt-py", "fmt-c", "fmt-rust"] }
lint-py = "ruff check"

[dependencies]
ruff = ">=0.15.20,<0.16"
clang-format = ">=22.1.8,<23"
cppcheck = ">=2.21.0,<3"
valgrind = ">=3.27.1,<4"
pyrefly = ">=1.1.1,<2"
python = ">=3.14.6,<3.15"
