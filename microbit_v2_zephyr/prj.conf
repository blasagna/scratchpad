CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# --- console shell -----------------------------------------------------------
# The board already chooses uart0 for both `zephyr,console` and
# `zephyr,shell-uart`, so the shell lands on the same USB CDC port the log
# already uses. SHELL_LOG_BACKEND is `default y if LOG`, which is what keeps log
# records from shredding a half-typed command line, so it is not set here.
CONFIG_SHELL=y
# Deferred logging moves formatting off the calling thread. The sensor threads
# log from timer and input callbacks, where the synchronous mode's spinlock is
# held across the whole UART write.
CONFIG_LOG_MODE_DEFERRED=y
# `log enable dbg accel` at runtime, which is the point of the per-module
# LOG_MODULE_REGISTER calls -- accel.c, temp.c, and buttons.c all have LOG_DBG
# statements that nothing could otherwise reach without a rebuild.
#
# This only works because every module now registers at LOG_LEVEL_DBG. That
# argument is the COMPILE-TIME ceiling, and log_filter_set() clamps the runtime
# level to it, so with the modules at LOG_LEVEL_INF `log enable dbg accel`
# answered "level set to inf" and silently did nothing.
CONFIG_LOG_CMDS=y
# Raising that ceiling is what makes the console noisy if this line is missing.
# The serial backend's initial limit defaults to LOG_LEVEL_DEFAULT, "the system
# limit", which follows the compile ceiling -- so every module came up at dbg
# and temp.c alone printed a die reading every second. This pins the *initial
# runtime* level to inf. It is not a second ceiling: log_filter_set() clamps
# against the compile-time level, so `log enable dbg accel` still reaches dbg.
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_INF=y
# `sensor get accel0` and `adc adc@40007000 read 3` reach the LSM303AGR and the
# microphone channel independently of the app's own threads, which is what makes
# them useful for telling a driver fault from an application one.
#
# SENSOR_SHELL is the most expensive line in this file: it `select`s
# SENSOR_ASYNC_API, which pulls in RTIO, and measures at 14 KB of flash and
# 6.6 KB of RAM -- more RAM than the whole rest of the shell tier. Drop it first
# if this ever needs to shrink; ADC_SHELL costs almost nothing by comparison.
CONFIG_SENSOR_SHELL=y
CONFIG_ADC_SHELL=y
# `input report 1 30 1` injects a synthetic button-A press. buttons.c registers
# its callback with INPUT_CALLBACK_DEFINE(NULL, ...), so it listens to every
# device and cannot tell a synthetic event from a real one -- the whole path
# runs, BLE notification included. That is the acoustically clean way to start a
# capture: pressing A physically taps the PCB centimetres from the microphone
# and puts the thump into the very block being measured. `input dump on` logs
# every event, which is the cheapest way to watch the button stream.
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_EVENT_DUMP=y
# KERNEL_SHELL and DEVICE_SHELL are both `default y` once SHELL is on. These two
# are what `kernel thread stacks` needs to report high-water marks, and they are
# only `imply`-ed, so state them: every stack size in this app is a guess until
# it has been measured.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y
# `audio raw` and `audio spectrum` print floats. SENSOR_SHELL selects this too,
# but src/audio.c should not depend on that having happened.
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- sensors -----------------------------------------------------------------
# CONFIG_SENSOR is enough: TEMP_NRF5 and LIS2DH are both `default y` off their
# devicetree nodes.
CONFIG_SENSOR=y
# No trigger: the app polls. P0.25 is COMBINED_SENSOR_INT, an open-collector line
# with no pull-up anywhere on the board, and Zephyr's board DTS omits GPIO_PULL_UP,
# so the line can never rise once something has pulled it low. It is also shared
# with the magnetometer and the interface MCU. Selecting NONE drops the driver's
# trigger thread and its 1 KB stack. See accel.c.
CONFIG_LIS2DH_TRIGGER_NONE=y
CONFIG_LIS2DH_ACCEL_RANGE_2G=y
# The magnetometer is unused here, and leaving it out is not just dead weight:
# LIS2MDL is `default y` off the board's DTS and its trigger mode defaults to
# GLOBAL_THREAD, which arms a rising-edge interrupt on that same never-rising
# P0.25 at init, for a sensor nothing reads.
CONFIG_LIS2MDL=n

# --- buttons and buzzer ------------------------------------------------------
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_BUZZER=y

# --- LED matrix --------------------------------------------------------------
# MICROBIT_DISPLAY has no `default y` and depends on DISPLAY + PRINTK.
CONFIG_DISPLAY=y
CONFIG_MICROBIT_DISPLAY=y

# --- audio capture and FFT ---------------------------------------------------
CONFIG_ADC=y
CONFIG_FPU=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_WINDOW=y

# --- bluetooth ---------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="microbit-v2"

# The default ATT MTU is 23, which leaves 20 usable bytes -- three accelerometer
# samples. Raising it is what makes the batching requirement mean anything.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# No CONFIG_BT_GATT_CLIENT: this is a pure GATT server. It was set so the
# peripheral could call bt_gatt_exchange_mtu() itself, which turned out to hang
# the ATT transaction against BlueZ and drop the link 30 s later. See ble.c.

# Ask for a short connection interval: 6 * 1.25 ms = 7.5 ms to 12 * 1.25 = 15 ms.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
