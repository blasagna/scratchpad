CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# --- sensors -----------------------------------------------------------------
# CONFIG_SENSOR is enough: TEMP_NRF5 and LIS2DH are both `default y` off their
# devicetree nodes.
CONFIG_SENSOR=y
# No trigger: the app polls. P0.25 is COMBINED_SENSOR_INT, an open-collector line
# with no pull-up anywhere on the board, and Zephyr's board DTS omits GPIO_PULL_UP,
# so the line can never rise once something has pulled it low. It is also shared
# with the magnetometer and the interface MCU. Selecting NONE drops the driver's
# trigger thread and its 1 KB stack. See accel.c.
CONFIG_LIS2DH_TRIGGER_NONE=y
CONFIG_LIS2DH_ACCEL_RANGE_2G=y
# The magnetometer is unused here, and leaving it out is not just dead weight:
# LIS2MDL is `default y` off the board's DTS and its trigger mode defaults to
# GLOBAL_THREAD, which arms a rising-edge interrupt on that same never-rising
# P0.25 at init, for a sensor nothing reads.
CONFIG_LIS2MDL=n

# --- buttons and buzzer ------------------------------------------------------
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_BUZZER=y

# --- LED matrix --------------------------------------------------------------
# MICROBIT_DISPLAY has no `default y` and depends on DISPLAY + PRINTK.
CONFIG_DISPLAY=y
CONFIG_MICROBIT_DISPLAY=y

# --- audio capture and FFT ---------------------------------------------------
CONFIG_ADC=y
CONFIG_FPU=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_WINDOW=y

# --- bluetooth ---------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="microbit-v2"

# The default ATT MTU is 23, which leaves 20 usable bytes -- three accelerometer
# samples. Raising it is what makes the batching requirement mean anything.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# No CONFIG_BT_GATT_CLIENT: this is a pure GATT server. It was set so the
# peripheral could call bt_gatt_exchange_mtu() itself, which turned out to hang
# the ATT transaction against BlueZ and drop the link 30 s later. See ble.c.

# Ask for a short connection interval: 6 * 1.25 ms = 7.5 ms to 12 * 1.25 = 15 ms.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
