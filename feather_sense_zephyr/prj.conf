# --- language ----------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBC=n
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_LOG=y
# Deferred logging keeps formatting off the calling thread. Every sampling
# thread here logs from a timer or a trigger callback, where synchronous mode
# holds a spinlock across the whole USB write.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_CMDS=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_INF=y

# --- i2c ---------------------------------------------------------------------
CONFIG_I2C=y
# CONFIG_I2C_NRFX_TWIM is deliberately NOT set here, and cannot be: like
# USE_STDC_LSM6DS3TR_C it is a promptless symbol (drivers/i2c/Kconfig.nrfx:23)
# and assigning it in a config file is a hard Kconfig error. It comes from
# app.overlay re-declaring &i2c0 as "nordic,nrf-twim" and from nowhere else, so
# the way to confirm the DMA peripheral is the one actually bound is
# `grep CONFIG_I2C_NRFX_TWIM build/zephyr/.config` after a build.

# --- sensors -----------------------------------------------------------------
CONFIG_SENSOR=y

# The out-of-tree IMU driver (drivers/lsm6ds3trc/). Its own Kconfig `select`s
# USE_STDC_LSM6DS3TR_C -- that symbol has no prompt, so assigning it here would
# be a hard Kconfig error rather than a no-op.
CONFIG_LSM6DS3TRC=y

# Drain the FIFO on the chip's own watermark interrupt rather than on a timer.
# The `irq-gpios` property in app.overlay is necessary but not sufficient: the
# driver's trigger-mode choice defaults to LSM6DS3TRC_TRIGGER_NONE, so without
# this line the property only makes the trigger *available*. GLOBAL_THREAD
# rather than OWN_THREAD because the handler does nothing but give a semaphore
# -- the draining happens on the application's own imu thread, which already
# exists and is already the highest-priority sampler.
CONFIG_LSM6DS3TRC_TRIGGER_GLOBAL_THREAD=y

# Both of these are traps: the driver's defaults are "0.625" Hz and +-4 gauss,
# neither of which is what this application wants. Output data rate is set,
# never inherited -- the failure mode of getting it wrong is re-reading samples
# the chip has not refreshed.
CONFIG_LIS3MDL_ODR="20"
CONFIG_LIS3MDL_FS=4

# The SHT30 driver defaults to PERIODIC mode at one measurement per second, not
# to the blocking single-shot conversion the design document assumed -- see
# drivers/sensor/sensirion/sht3xd/Kconfig. In periodic mode a fetch is a
# FETCH_DATA command and a read, and the chip NACKs it when no new measurement
# is ready. Against a 1 Hz consumer and a 1 MPS chip that is a race the consumer
# loses whenever it drifts ahead, which showed up as intermittent
# "Failed to fetch samples". Two measurements per second means a 1 Hz reader
# always finds one waiting. Measured on hardware.
CONFIG_SHT3XD_MPS_2=y

# Ambient light only. Gesture sense is off by default and stays off: nothing
# reads it, and it costs an I2C transaction per fetch.
CONFIG_APDS9960_ENABLE_ALS=y
CONFIG_APDS9960_ENABLE_GESTURE=n

# --- battery -----------------------------------------------------------------
# The `vbatt` voltage-divider node is already in the board DTS.
CONFIG_ADC=y

# --- button ------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_INPUT=y
# CONFIG_INPUT_THREAD_STACK_SIZE is deliberately left at its 1024 default. The
# button callback runs on the input subsystem's own thread and streams::emit()
# builds a batch on the caller's stack -- 242 bytes, sized for a full IMU
# notification even though a button sample is four -- which looked worth a bump
# until it was measured: `kernel thread stacks` after an `input report` shows the
# input thread peaking at 392 bytes, 38 % of the default. Measured, not assumed.

# --- status led --------------------------------------------------------------
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_GPIO=y
# Required, or ws2812_gpio.c does not compile. Left unset -- which is this
# board's default, since it pulls in the newer split HFCLK/LFCLK drivers -- the
# driver takes its `#else` branch at ws2812_gpio.c:139, which references a
# `drv_data` the surrounding function no longer declares. Build error, not a
# runtime one. See README.md, "known limitations".
CONFIG_CLOCK_CONTROL_NRF=y

# --- where the image is linked --------------------------------------------
# Without this the image links at flash offset 0 and `west flash` would write
# it over the s140 SoftDevice -- and over the MBR at 0x0 that the Adafruit
# bootloader itself depends on, which takes the bootloader with it and leaves
# SWD as the only way back. This board's *_uf2_defconfig files do not set it
# (the ItsyBitsy nRF52840, same bootloader and same layout, does:
# boards/adafruit/itsybitsy/adafruit_itsybitsy_nrf52840_defconfig), so it is an
# upstream board-support gap and this line is the whole fix. With it, the image
# links at the `code_partition` the DTS declares -- 0x26000, the Application
# partition -- and the UF2's start address says so. Check it after a build:
#   grep CONFIG_FLASH_LOAD_OFFSET build/zephyr/.config    # 0x26000, not 0
# Zephyr brings its own BLE controller and never calls the SoftDevice; it is
# left in place only because the bootloader expects it to be there.
CONFIG_USE_DT_CODE_PARTITION=y

# --- usb ---------------------------------------------------------------------
# The board's Kconfig.cdc_acm_serial.defconfig turns USB_DEVICE_STACK_NEXT and
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT on by itself. The boot-time initializer must
# be turned back OFF here: subsys/usb/device_next/app/cdc_acm_serial.c registers
# only `cdc_acm_0` ("This code only registers the first CDC-ACM instance"), so
# with it in charge the application's own cdc_acm_data instance is built, bound
# to a Zephyr device, and never enumerated -- writes to it succeed and go
# nowhere. src/usb.cpp does the usbd setup instead, with
# usbd_register_all_classes(), so both instances appear on the host.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- bluetooth ---------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="feather-sense"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# The default ATT MTU is 23, which leaves 20 usable bytes -- one IMU sample and
# most of a header. Raising it is what makes the batching requirement mean
# anything: at 247 a notification carries 19 IMU samples.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# The nRF52840's 2M PHY. Together with the MTU this is where the expected win
# over the CircuitPython port's ~4.4 KB/s comes from -- not from interval
# tuning, which that port measured as a no-op.
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Notifications are queued from the tx thread faster than one connection
# interval; without the extra buffers bt_gatt_notify() returns -ENOMEM under
# load rather than blocking.
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
# Each queued ACL TX buffer needs an event buffer to carry its completion back
# from the controller, and the host asserts at build time that there are more
# of the latter than the former ("Increase Event RX buffer count to be greater
# than ACL TX buffer count"). This is that assertion satisfied, not a tuning
# choice.
CONFIG_BT_BUF_EVT_RX_COUNT=12

# --- rpc ---------------------------------------------------------------------
# `get serial` (opcode 0x04) reads the FICR DEVICEID words through this -- a
# real per-chip identifier rather than a build constant.
CONFIG_HWINFO=y
# `fs bootloader` needs sys_reboot().
CONFIG_REBOOT=y

# --- console shell -----------------------------------------------------------
CONFIG_SHELL=y
# `i2c scan i2c@40003000` is what answers which parts this board revision
# actually carries, and `i2c read_byte i2c@40003000 0x6a 0x0f` is what settles
# which IMU it has (0x69 = LSM6DS33, 0x6a = LSM6DS3TR-C).
CONFIG_I2C_SHELL=y
# Reads every stream with no host program attached, which is what tells a driver
# fault from an application one. SENSOR_SHELL is the expensive line -- it
# selects SENSOR_ASYNC_API and pulls in RTIO. Drop it first if this needs to
# shrink.
CONFIG_SENSOR_SHELL=y
CONFIG_ADC_SHELL=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_EVENT_DUMP=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
# Every stack size in this application is a guess until `kernel thread stacks`
# has reported a high-water mark.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y
