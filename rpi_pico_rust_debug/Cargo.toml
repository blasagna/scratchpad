[workspace]

[package]
name = "rpi_pico_rust_debug"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rpi_pico_rust_debug"
path = "src/main.rs"

[dependencies]
embassy-executor = { version = "0.10", features = ["defmt"] }
embassy-rp        = { version = "0.10", features = ["defmt", "rp2040", "time-driver", "critical-section-impl", "executor-thread"] }
embassy-time      = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }

cortex-m     = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt  = "0.7"

defmt      = "1"
defmt-rtt  = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.dev]
debug = 2
opt-level = 1
# Keep debug info + low optimization in dev builds so breakpoints and
# variable inspection in probe-rs / GDB line up cleanly with the source.

[profile.release]
debug = 2
lto = true
opt-level = "s"
