[package]
name = "pico-probe-lab"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-rp        = { version = "0.2", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time      = { version = "0.3" }

cortex-m     = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt  = "0.7"

defmt      = "0.3"
defmt-rtt  = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.dev]
debug = 2
opt-level = 1
# Keep debug info + low optimization in dev builds so breakpoints and
# variable inspection in probe-rs / GDB line up cleanly with the source.

[profile.release]
debug = 2
lto = true
opt-level = "s"
