[workspace]
resolver = "3"
members = [
    "text_analyzer/rust",
    "morse_trainer",
    "copy_file/rust",
    "simple_logger/rust",
    "matrix_ops/rust",
    "matrix_ops/bench/rust",
    "mini_shell/rust",
    "tiny_http_server/rust",
    "cpp_rust_bindings/rust",
    "rust_hosted_cpp/rust",
    "rust_python_bindings/core",
    "rust_python_bindings/bindings",
    # The firmware in rpi_pico_rust_debug/ is its own workspace (it targets
    # thumbv6m-none-eabi), but this leaf crate of it is pure host-buildable
    # math, and lives here so `cargo test` covers it like everything else.
    "rpi_pico_rust_debug/rp2040_temp",
]
