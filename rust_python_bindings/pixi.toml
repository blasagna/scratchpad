[workspace]
authors = ["Bob DiMaiolo <bdimaiolo@gmail.com>"]
channels = ["conda-forge"]
name = "rust_python_bindings"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# `maturin develop` compiles the cdylib and installs statkit into this pixi
# environment in editable form. VIRTUAL_ENV points maturin at the pixi env, which
# it would otherwise not recognize as an install target. cargo comes from the
# system toolchain, as it does everywhere else in this repo. maturin shells out to
# `uv` for the install step whenever uv is on PATH, and recent uv versions refuse
# to trust VIRTUAL_ENV unless it has a venv's pyvenv.cfg marker -- which a conda/pixi
# env never has. UV_SYSTEM_PYTHON=1 tells uv to install into whatever Python it
# finds instead of demanding that marker.
build = "VIRTUAL_ENV=$CONDA_PREFIX UV_SYSTEM_PYTHON=1 maturin develop"
test = { cmd = "python -m unittest discover -s tests -v", depends-on = ["build"] }
cli = { cmd = "python -m statkit", depends-on = ["build"] }
# --search-path lets `import statkit` resolve to `python/statkit` via its
# hand-written `_core.pyi` stub, so this doesn't need `build` (a real compiled
# extension) to run.
type = "pyrefly check python tests --search-path python"

[dependencies]
python = ">=3.14.6,<3.15"
maturin = ">=1.14.1,<2"
pip = ">=25"
pyrefly = ">=1.1.1,<2"
