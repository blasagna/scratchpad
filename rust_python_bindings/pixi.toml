[workspace]
authors = ["Bob DiMaiolo <bdimaiolo@gmail.com>"]
channels = ["conda-forge"]
name = "rust_python_bindings"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# `maturin develop` compiles the cdylib and installs statkit into this pixi
# environment in editable form. VIRTUAL_ENV points maturin at the pixi env, which
# it would otherwise not recognize as an install target. cargo comes from the
# system toolchain, as it does everywhere else in this repo.
build = "VIRTUAL_ENV=$CONDA_PREFIX maturin develop"
test = { cmd = "python -m unittest discover -s tests -v", depends-on = ["build"] }
cli = { cmd = "python -m statkit", depends-on = ["build"] }

[dependencies]
python = ">=3.14.6,<3.15"
maturin = ">=1.14.1,<2"
pip = ">=25"
