# Everything else is ruff's stock default on purpose; this file exists for one
# reason. With no `requires-python` anywhere in the repo (no area has a
# pyproject.toml except rust_python_bindings, which maturin owns), ruff assumes an
# old Python and reports 3.11+ builtins such as `ExceptionGroup` as undefined names.
# Every pixi workspace here pins `python = ">=3.14.6,<3.15"`, so state that once.
target-version = "py314"
