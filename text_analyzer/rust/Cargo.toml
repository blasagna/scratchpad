[package]
name = "text_analyzer"
version = "0.1.0"
edition = "2024"

[lib]
name = "text_analyzer"
path = "src/lib.rs"

[[bin]]
name = "text_analyzer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
