# --- language ----------------------------------------------------------------
# This port is C++ -- the counterpart to the Rust sibling next door, and to the
# C micro:bit app. CONFIG_CPP turns on the C++ support library; STD_CPP20 pins
# the standard to match the repo's other C++ (the Bazel ports build -std=c++20).
CONFIG_CPP=y
CONFIG_STD_CPP20=y

# --- logging + console -------------------------------------------------------
# Logs go to uart0 (GP0 = TX, GP1 = RX), which the board also chooses for the
# shell. With a Raspberry Pi Debug Probe, wire the probe's UART port to GP0/GP1
# to read them at 115200. See README.md.
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# --- on-device shell ---------------------------------------------------------
# A live introspection path beside the external debugger: `kernel threads`,
# `kernel stacks`, `log enable dbg <module>`, and this app's own `temp` command.
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
# Deferred logging moves formatting off the calling thread and keeps log records
# from shredding a half-typed command line.
CONFIG_LOG_MODE_DEFERRED=y
# `log enable dbg <module>` at runtime -- the point of the per-module
# LOG_MODULE_REGISTER call.
CONFIG_LOG_CMDS=y
# `kernel stacks` reports stack high-water marks, which INIT_STACKS provides.
# The thread names and registry `kernel threads` needs come from
# CONFIG_DEBUG_THREAD_INFO below (it selects THREAD_NAME and THREAD_MONITOR), so
# they are not repeated here.
CONFIG_INIT_STACKS=y

# --- heartbeat LED -----------------------------------------------------------
# Drives the optional external LED declared under `zephyr,user` in app.overlay.
CONFIG_GPIO=y

# --- debuggability -----------------------------------------------------------
# The whole point of this project.
#
# DEBUG_OPTIMIZATIONS builds at -Og with frame pointers, so breakpoints land on
# the source line you asked for and backtraces read cleanly. At the default -O2
# the loop is reordered and inlined past recognition.
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
# Exports kernel struct offsets so OpenOCD/GDB can enumerate Zephyr threads
# (thread-aware `info threads` and backtraces). Selects THREAD_MONITOR/NAME.
CONFIG_DEBUG_THREAD_INFO=y
# Turns the deliberate out-of-bounds write into a deterministic fatal error
# instead of silent corruption -- see the __ASSERT in src/main.cpp.
CONFIG_ASSERT=y
# Collect register/fault state and walk the stack on a fatal error, so the
# assert prints a symbolic backtrace. EXTRA_EXCEPTION_INFO is what enables
# arch_stack_walk() on Cortex-M (it gates ARCH_HAS_STACKWALK); EXCEPTION_STACK_TRACE
# then defaults on and does the printing.
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_EXCEPTION_STACK_TRACE=y
